<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Laboratorio · dati animati</title>
<link rel="stylesheet" href="style.css">
<style>
  .lab-bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
    padding: 14px var(--sp-xl); background: rgba(23,24,24,0.6); backdrop-filter: blur(8px); border-bottom: 1px solid var(--wire);
    font-family: var(--font-display); font-weight: 700; font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; }
  .lab-bar .tit { color: var(--muted); margin-right: auto; }
  .lab-bar button { font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--white); background: transparent;
    border: 1px solid var(--wire); border-radius: 999px; padding: 8px 16px; cursor: pointer; }
  .lab-bar button[aria-pressed="true"] { border-color: var(--screen); color: var(--screen); }
  .lab-note { position: relative; z-index: 2; margin: 0 auto; padding: var(--sp-sm) var(--sp-xl) 0; max-width: 60vw; color: var(--muted); font-size: 0.9rem; }
  /* stessa colonna del main screen */
  main { position: relative; z-index: 2; margin: 0 auto; padding: var(--sp-md) var(--sp-xl) var(--sp-xl); max-width: 60vw; }

  /* ---- proposte cap. 4: la scelta si sposta in style.css ---- */
  .v-vinile, .v-monete { --viz: var(--screen); }
  .v-vinile .corpo { fill: #101416; }
  .v-vinile .solchi circle { fill: none; stroke: rgba(255,255,255,0.08); }
  .v-vinile .etichetta circle { fill: var(--ochre); }
  .v-vinile .etichetta .foro { fill: var(--bg-slate); }
  .v-vinile .etichetta text { font-family: var(--font-display); font-weight: 800; font-size: 9px; letter-spacing: 0.16em; fill: var(--bg-black); text-anchor: middle; }
  .v-vinile .luce { fill: var(--screen); opacity: 0.55; }

  .v-monete .tag { font-family: var(--font-display); font-weight: 700; font-size: 11px; letter-spacing: 0.16em; fill: var(--muted); }

  .v-monete .fonte { fill: rgba(255,255,255,0.08); stroke: var(--wire); }
  .v-monete .play { fill: var(--white); }
  .v-monete .vaso { fill: rgba(255,255,255,0.05); stroke: var(--wire); }
  .v-monete .liv.umani { fill: var(--ochre); }
  .v-monete .liv.loro { fill: var(--screen); }
  .v-monete .moneta { fill: var(--ochre); opacity: 0; }
</style>
</head>
<body>
<nav class="lab-bar">
  <span class="tit">Laboratorio · cap. 4 · il dato animato</span>
  <button data-v="a">A · Il vinile</button>
  <button data-v="b">B · L'equalizzatore</button>
  <button data-v="c">C · Le monete</button>
  <button id="replay">↻ Rigioca</button>
</nav>
<p class="lab-note" id="note"></p>

<main>
  <div class="year">2030</div>
  <h2>Regia: nessuno</h2>
  <p class="signal">Già nel 2025 una band finta, fatta con l'AI, aveva quasi un milione di ascoltatori al mese.</p>
  <div id="stage"></div>
</main>

<script src="/vendor/gsap/gsap.min.js"></script>
<script src="viz.js"></script>
<script>
// ==========================================================================
// LABORATORIO — le proposte si registrano in VIZ.tipi con gli helper di
// VIZ.lib, e girano con la stessa VIZ.run del main screen: la scelta passa in
// viz.js spostando il suo blocco, senza riscriverla.
//   ?end → salta allo stato finale · ?t=2.5 → ferma la timeline a 2,5 s
// ==========================================================================
const G = window.gsap, { f1, figura, conta, vivo } = VIZ.lib;
const Q = new URLSearchParams(location.search), $ = (id) => document.getElementById(id);
const SCREEN = getComputedStyle(document.documentElement).getPropertyValue("--screen").trim();
const DATO = { to: 24, label: "dei guadagni di chi fa musica, a rischio entro il 2028 per l'AI (CISAC)" };

// --------------------------------------------------------------------------
// A · IL VINILE — il disco sono i guadagni di chi fa musica. Una fetta si
// accende della luce fredda delle macchine e si stacca; il resto gira ancora.
// --------------------------------------------------------------------------
const VIN = { CX: 360, CY: 170, RO: 150, RI: 46 };
const pv = (a, r) => `${f1(VIN.CX + r * Math.sin(a))},${f1(VIN.CY - r * Math.cos(a))}`;   // angolo da ore 12, orario
// corona circolare da a0 ad a1: una fetta di solchi, fuori dall'etichetta
const settore = (a0, a1, ri = VIN.RI, ro = VIN.RO + 2) => {
  if (a1 - a0 <= 0) return "";
  const L = a1 - a0 > Math.PI ? 1 : 0;
  return `M${pv(a0, ro)} A${ro},${ro} 0 ${L} 1 ${pv(a1, ro)} L${pv(a1, ri)} A${ri},${ri} 0 ${L} 0 ${pv(a0, ri)} Z`;
};
VIZ.tipi.vinile = {
  html(d) {
    const { CX, CY, RO } = VIN, a = d.to / 100 * 2 * Math.PI;
    let solchi = "";
    for (let r = 54; r <= RO - 4; r += 4) solchi += `<circle cx="${CX}" cy="${CY}" r="${r}"/>`;
    const disco = `<circle class="corpo" cx="${CX}" cy="${CY}" r="${RO}"/><g class="solchi">${solchi}</g>`;
    return figura("vinile", "0 0 720 340", `
      <defs><clipPath id="viz-fetta"><path d="${settore(0, a)}"/></clipPath><clipPath id="viz-resto"><path d="${settore(a, 2 * Math.PI)}"/></clipPath></defs>
      <g class="gira"><g clip-path="url(#viz-resto)">${disco}</g>
        <g class="etichetta"><circle cx="${CX}" cy="${CY}" r="${VIN.RI}"/><text x="${CX}" y="${CY - 14}">LATO A</text><text x="${CX}" y="${CY + 22}">2030</text><circle class="foro" cx="${CX}" cy="${CY}" r="4"/></g></g>
      <g class="fetta"><g clip-path="url(#viz-fetta)">${disco}</g><path class="luce" d=""/></g>`, d);
  },
  run(fig) {
    const { CX, CY } = VIN, pct = +fig.dataset.to, a = pct / 100 * 2 * Math.PI, o = { t: 0 }, O = `${CX} ${CY}`;
    const gira = fig.querySelector(".gira"), fetta = fig.querySelector(".fetta"), luce = fig.querySelector(".luce"), el = fig.querySelector(".v-count");
    const tl = G.timeline();
    tl.from([gira, fetta], { scale: 0.85, opacity: 0, svgOrigin: O, duration: 0.8, ease: "power3.out" }, 0)
      // la luce fredda si prende la fetta, solco dopo solco…
      .to(o, { t: 1, duration: 2.2, ease: "power1.inOut", onUpdate: () => luce.setAttribute("d", settore(0, a * o.t)) }, 0.9)
      // …e la fetta si stacca dal disco
      .to(fetta, { x: 34 * Math.sin(a / 2), y: -34 * Math.cos(a / 2), duration: 0.9, ease: "power3.inOut" }, 3.4);
    tl.eventCallback("onUpdate", () => { el.textContent = `${Math.round(pct * o.t)}%`; });
    // il resto continua a girare, con il buco
    tl.eventCallback("onComplete", () => vivo(G.to(gira, { rotation: 360, svgOrigin: O, duration: 10, ease: "none", repeat: -1 })));
    return tl;
  }
};

// --------------------------------------------------------------------------
// C · LE MONETE — ogni moneta è l'1% di quello che rende la musica. Partono
// dagli ascolti verso chi l'ha fatta; 24 su 100 cambiano strada.
// --------------------------------------------------------------------------
VIZ.tipi.monete = {
  html(d) {
    const vaso = (y, cls, tag, ty) => `<rect class="vaso" x="560" y="${y}" width="90" height="124" rx="6"/>
      <rect class="liv ${cls}" data-fondo="${y + 122}" x="562" y="${y + 122}" width="86" height="0" rx="3"/>
      <text class="tag" x="605" y="${ty}" text-anchor="middle">${tag}</text>`;
    return figura("monete", "0 0 720 340", `
      <circle class="fonte" cx="110" cy="170" r="34"/><path class="play" d="M100,154 l30,16 l-30,16 z"/>
      <text class="tag" x="110" y="228" text-anchor="middle">GLI ASCOLTI</text>
      ${vaso(40, "umani", "A CHI CREA", 30)}${vaso(190, "loro", "ALLE MACCHINE", 334)}
      <g>${'<circle class="moneta" cx="146" cy="170" r="4.5"/>'.repeat(100)}</g>`, d);
  },
  run(fig) {
    const coins = [...fig.querySelectorAll(".moneta")], pct = +fig.dataset.to, el = fig.querySelector(".v-count");
    const liv = { a: fig.querySelector(".umani"), b: fig.querySelector(".loro") };
    const P = { a: [[146, 170], [380, 20], [605, 46]], b: [[146, 170], [380, 300], [605, 196]] };
    const bez = ([p0, p1, p2], t) => [0, 1].map(k => (1 - t) ** 2 * p0[k] + 2 * (1 - t) * t * p1[k] + t * t * p2[k]);
    const tl = G.timeline(), T0 = 0.4, PASSO = 0.03, VIAGGIO = 1.1, arrivi = { a: [], b: [] };
    coins.forEach((c, i) => {
      const via = Math.floor((i + 1) * pct / 100) > Math.floor(i * pct / 100) ? "b" : "a";   // 24 su 100, sparse nel flusso
      const t0 = T0 + i * PASSO, o = { t: 0 };
      tl.set(c, { opacity: 1 }, t0)
        .to(o, { t: 1, duration: VIAGGIO, ease: "power1.inOut", onUpdate: () => { const [x, y] = bez(P[via], o.t); c.setAttribute("cx", f1(x)); c.setAttribute("cy", f1(y)); } }, t0)
        .set(c, { opacity: 0 }, t0 + VIAGGIO);
      if (via === "b") tl.set(c, { fill: SCREEN }, t0 + VIAGGIO * 0.35);   // al bivio cambia colore
      arrivi[via].push(t0 + VIAGGIO);
    });
    // i vasi salgono di un'unità per moneta arrivata; il numero conta quelle deviate
    tl.eventCallback("onUpdate", () => {
      const t = tl.time();
      for (const k of ["a", "b"]) {
        const h = arrivi[k].filter(x => x <= t).length * 1.2;
        liv[k].setAttribute("height", h); liv[k].setAttribute("y", liv[k].dataset.fondo - h);
      }
      el.textContent = `${arrivi.b.filter(x => x <= t).length}%`;
    });
    return tl;
  }
};

// --------------------------------------------------------------------------
const VARIANTI = {
  a: { tipo: "vinile", legenda: "il disco sono i guadagni di chi fa musica: quasi un quarto rischia di finire a chi possiede l'AI",
       nota: "A · Il vinile — Il disco sono i guadagni di chi fa musica: una fetta del 24% si accende della luce fredda delle macchine e si stacca, il resto continua a girare con il buco. La più iconica." },
  b: { tipo: "equalizzatore", legenda: "100 barre = i guadagni di chi fa musica · 24 rischiano di passare alle macchine",
       nota: "B · L'equalizzatore — SCELTA per il capitolo 4: questa scheda mostra già la versione inserita in viz.js." },
  c: { tipo: "monete", legenda: "ogni moneta = 1% dei guadagni · 24 su 100 rischiano di finire a chi possiede l'AI",
       nota: "C · Le monete — Ogni moneta è l'1% di quello che rende la musica: partono dagli ascolti, 76 arrivano a chi crea, 24 cambiano strada e colore verso chi possiede le macchine. La più letterale." }
};
function gioca(v) {
  if (!VARIANTI[v]) v = "a";
  const { tipo, legenda, nota } = VARIANTI[v];
  VIZ.stop();
  document.querySelectorAll("[data-v]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.v === v)));
  $("note").textContent = nota;
  $("stage").innerHTML = VIZ.html({ [tipo]: { ...DATO, legenda } });
  const [tl] = VIZ.run($("stage"));
  if (Q.has("t")) tl.pause().time(+Q.get("t"));
  else if (Q.has("end")) tl.progress(1);
}
document.querySelectorAll("[data-v]").forEach(b => b.onclick = () => { history.replaceState(null, "", "#" + b.dataset.v); gioca(b.dataset.v); });
$("replay").onclick = () => gioca(location.hash.slice(1));
gioca(location.hash.slice(1));
</script>
</body>
</html>
